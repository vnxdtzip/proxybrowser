<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: https:; style-src 'unsafe-inline'; script-src 'self'; connect-src https://ipinfo.io" />
<title>Unleashed Browser</title>
<style>
  :root {
    --bg:#0e0f13; --fg:#e9ebf0; --fg-dim:#aab1bd; --fg-mut:#6b7280;
    --hair:rgba(255,255,255,.08); --hair-2:rgba(255,255,255,.13);
    --accent:#58a6ff; --ok:#3fb950; --bad:#f85149;
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --font-disp:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code","Cascadia Mono",ui-monospace,"Consolas",monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font:13px/1.5 var(--font); overflow:hidden; user-select:none;
              -webkit-font-smoothing:antialiased; }
  #globe { position:fixed; inset:0; z-index:0; }
  /* vinheta: foca o olhar no centro e assenta o texto sobre o globo */
  body::after { content:''; position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(130% 90% at 50% 38%, transparent 42%, rgba(10,11,15,.55) 100%); }

  .brand { position:fixed; top:20px; left:22px; z-index:3; display:flex; align-items:center; gap:10px; }
  .brand .logo { width:22px; height:22px; object-fit:contain; border-radius:5px; }
  .brand .name { font-family:var(--font-disp); font-size:13px; font-weight:600; letter-spacing:-.005em; }
  .brand .tag { font-size:11px; color:var(--fg-mut); letter-spacing:.03em;
                padding-left:10px; margin-left:2px; border-left:1px solid var(--hair-2); }

  .wrap { position:fixed; z-index:3; left:0; right:0; bottom:9%; display:flex;
          flex-direction:column; align-items:center; text-align:center; padding:0 24px; }

  .endpoints { display:flex; align-items:stretch; gap:16px; margin-bottom:26px; }
  .ep { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:150px;
        padding:12px 16px; border:1px solid var(--hair); border-radius:11px;
        background:rgba(21,23,28,.5); backdrop-filter:blur(8px); }
  .ep .k { font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--fg-mut); font-weight:600; }
  .ep .v { color:var(--fg); font-family:var(--mono); font-size:12.5px; }
  .ep .sub { color:var(--fg-mut); font-size:11px; }
  .link { align-self:center; flex:none; width:56px; height:1px; position:relative;
          background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:.65; }
  .link::after { content:''; position:absolute; top:-2px; width:5px; height:5px; border-radius:50%;
                 background:var(--accent); box-shadow:0 0 8px var(--accent); animation:travel 1.6s linear infinite; }
  @keyframes travel { from{left:-3px} to{left:54px} }

  .status { font-family:var(--font-disp); font-size:25px; font-weight:600; letter-spacing:-.015em; min-height:30px; }
  .status.ok { color:var(--ok); }
  .status.fail { color:var(--bad); }
  .msg { color:var(--fg-dim); font-size:13px; margin-top:8px; min-height:18px; }

  .bar { width:min(380px,72vw); height:3px; background:var(--hair-2); border-radius:3px;
         margin-top:20px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--accent);
             box-shadow:0 0 10px var(--accent); border-radius:3px; transition:width .5s ease; }
  .bar.ok > i { background:var(--ok); box-shadow:0 0 10px var(--ok); }
  .bar.fail > i { background:var(--bad); box-shadow:none; }

  .detail { margin-top:18px; color:var(--fg-mut); font-size:12px; min-height:18px; line-height:1.6; }
  .detail b { color:var(--fg); font-weight:600; font-family:var(--mono); }

  .retry { margin-top:20px; display:none; background:var(--accent); color:#06152b; font-weight:600;
           border:none; border-radius:7px; padding:9px 20px; cursor:pointer; font-size:12.5px; transition:filter .12s; }
  .retry.show { display:inline-block; }
  .retry:hover { filter:brightness(1.08); }

  @media (prefers-reduced-motion: reduce) {
    .link::after { animation:none; }
    .bar > i { transition:none; }
  }
</style>
</head>
<body>
  <canvas id="globe"></canvas>

  <div class="brand">
    <img class="logo" src="../assets/logo.png" alt="" />
    <span class="name">Unleashed Browser</span>
    <span class="tag">túnel seguro</span>
  </div>

  <div class="wrap">
    <div class="endpoints">
      <div class="ep"><span class="k">Você</span><span class="v" id="epClient">IP mascarado</span><span class="sub" id="epClientSub">saída oculta</span></div>
      <div class="link" id="epLink"></div>
      <div class="ep"><span class="k">Proxy (VPS)</span><span class="v" id="epVps">—</span><span class="sub" id="epVpsSub">resolvendo…</span></div>
    </div>

    <div class="status" id="status">Conectando</div>
    <div class="msg" id="msg">Estabelecendo túnel TLS…</div>
    <div class="bar" id="bar"><i></i></div>
    <div class="detail" id="detail"></div>
    <button class="retry" id="retry">Tentar novamente</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
