<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: https:; style-src 'unsafe-inline'; script-src 'self'; connect-src https://ipinfo.io" />
<title>ProxyBrowser</title>
<style>
  :root { --bg:#15171c; --fg:#e7e9ee; --mut:#8a909c; --line:#2c303a;
          --accent:#5a8dd6; --ok:#4ec073; --bad:#e5604f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font:13px/1.45 system-ui,'Segoe UI',sans-serif; overflow:hidden; user-select:none; }
  #globe { position:fixed; inset:0; z-index:0; }

  .brand { position:fixed; top:18px; left:20px; z-index:2; display:flex; align-items:center;
           gap:9px; color:var(--mut); font-size:12px; letter-spacing:.02em; }
  .brand .d { width:8px; height:8px; border-radius:50%; background:var(--accent); }

  .wrap { position:fixed; z-index:2; left:0; right:0; bottom:8%; display:flex;
          flex-direction:column; align-items:center; text-align:center; padding:0 24px; }
  .endpoints { display:flex; align-items:center; gap:14px; color:var(--mut);
               font-size:12px; margin-bottom:22px; }
  .ep { display:flex; flex-direction:column; align-items:center; gap:3px; min-width:120px; }
  .ep .k { font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; opacity:.8; }
  .ep .v { color:var(--fg); font-size:12.5px; font-variant-numeric:tabular-nums; }
  .ep .v small { color:var(--mut); }
  .link { flex:none; width:70px; height:1px; background:linear-gradient(90deg,transparent,var(--accent),transparent);
          position:relative; }
  .link::after { content:''; position:absolute; top:-2px; width:5px; height:5px; border-radius:50%;
                 background:var(--accent); animation:travel 1.6s linear infinite; }
  @keyframes travel { from{left:-3px} to{left:68px} }

  .status { font-size:22px; font-weight:600; letter-spacing:.01em; min-height:28px; }
  .status.ok { color:var(--ok); }
  .status.fail { color:var(--bad); }
  .msg { color:var(--mut); font-size:12.5px; margin-top:7px; min-height:17px; }

  .bar { width:min(360px,70vw); height:3px; background:var(--line); border-radius:3px;
         margin-top:18px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--accent);
             border-radius:3px; transition:width .5s ease; }
  .bar.ok > i { background:var(--ok); }
  .bar.fail > i { background:var(--bad); }

  .detail { margin-top:16px; color:var(--mut); font-size:12px; min-height:16px;
            font-variant-numeric:tabular-nums; }
  .detail b { color:var(--fg); font-weight:600; }

  .retry { margin-top:18px; display:none; background:var(--accent); color:#fff; border:none;
           border-radius:7px; padding:9px 18px; cursor:pointer; font-size:12.5px; }
  .retry.show { display:inline-block; }
  .retry:hover { filter:brightness(1.07); }
</style>
</head>
<body>
  <canvas id="globe"></canvas>

  <div class="brand"><span class="d"></span>ProxyBrowser · túnel</div>

  <div class="wrap">
    <div class="endpoints">
      <div class="ep"><span class="k">Você</span><span class="v" id="epClient">IP mascarado</span><span class="k" id="epClientSub">localização aproximada</span></div>
      <div class="link" id="epLink"></div>
      <div class="ep"><span class="k">VPS</span><span class="v" id="epVps">—</span><span class="k" id="epVpsSub">resolvendo...</span></div>
    </div>

    <div class="status" id="status">Conectando</div>
    <div class="msg" id="msg">Inicializando túnel...</div>
    <div class="bar" id="bar"><i></i></div>
    <div class="detail" id="detail"></div>
    <button class="retry" id="retry">Tentar novamente</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
